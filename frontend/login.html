<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in - SettleUp</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head>
<body class="auth"><main class="card">
<a class="logo dark" href="index.html"><span class="mark">₹</span>SettleUp</a>
<h1>Welcome back</h1><p class="sub">See who owes what, and settle up.</p>
<div id="alert" class="alert" role="alert" hidden></div>
<form id="login-form" novalidate>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><div class="pw"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="btn ghost sm" data-toggle aria-label="Show password">Show</button></div></div>
<button class="btn green full" type="submit">Log in</button></form>
<p class="sub center">New here? <a href="register.html">Create an account</a></p><p class="sub note" id="devnote"></p>
</main>
<script src="js/config.js"></script><script src="js/mock.js"></script><script src="js/auth.js"></script><script src="js/api.js"></script>
</body></html>
