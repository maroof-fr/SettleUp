# Base path so endpoints match the frontend: http://localhost:8080/api/...
server.servlet.context-path=/api
server.port=8080

# Secrets come from environment variables, never from source control.
# DB_PASSWORD and JWT_SECRET are required: the app refuses to start without them.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/settleup?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# 'update' is fine for development. For production use 'validate' plus Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# JWT secret must be at least 32 characters (e.g. `openssl rand -base64 48`).
settleup.jwt.secret=${JWT_SECRET}
settleup.jwt.ttl-minutes=120
settleup.cors.origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
